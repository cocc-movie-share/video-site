<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://cocc-video-site-api.manato-inokuchi.workers.dev; media-src https://cocc-video-site-api.manato-inokuchi.workers.dev; img-src 'self' https://cocc-video-site-api.manato-inokuchi.workers.dev data:; style-src 'self'; script-src 'self'" />
    <meta name="robots" content="noindex" />
    <title>動画ライブラリ</title>
    <link rel="stylesheet" href="css/style.css" />
    <script type="module" src="js/viewer.js"></script>
  </head>
  <body>
    <main class="container">
      <h1 class="title">動画ライブラリ</h1>

      <section id="login-screen" class="card hidden">
        <form id="login-form" class="form">
          <label for="password">閲覧パスワード</label>
          <input id="password" class="input" type="password" autocomplete="current-password" required />
          <button id="login-button" class="button" type="submit">ログイン</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="main-screen" class="hidden">
        <div id="team-screen">
          <h2 class="subtitle">チームを選択</h2>
          <div id="team-list" class="team-list"></div>
        </div>

        <div id="list-screen" class="hidden">
          <div class="toolbar">
            <button id="back-button" class="button-sub" type="button">← チーム選択</button>
            <span id="current-team" class="badge"></span>
          </div>
          <div id="video-list"></div>
        </div>

        <p id="message" class="muted" role="status"></p>
        <button id="logout-button" class="button-sub" type="button">ログアウト</button>
      </section>
    </main>

    <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-box">
        <p id="modal-title" class="modal-title"></p>
        <video id="player" class="player" controls playsinline preload="metadata"></video>
        <div class="modal-actions">
          <button id="modal-save-button" class="button" type="button">保存</button>
          <button id="close-button" class="button-sub" type="button">閉じる</button>
        </div>
      </div>
    </div>
  </body>
</html>
