<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; connect-src 'self' https://*.workers.dev; media-src blob: https://*.workers.dev; img-src 'self' blob: data: https://*.workers.dev; style-src 'self'; script-src 'self'" />
    <meta name="robots" content="noindex" />
    <title>管理画面</title>
    <link rel="stylesheet" href="../css/style.css" />
    <script type="module" src="../js/admin.js"></script>
  </head>
  <body>
    <main class="container">
      <h1 class="title">管理画面</h1>

      <section id="login-screen" class="card hidden">
        <form id="login-form" class="form">
          <label for="password">管理者パスワード</label>
          <input id="password" class="input" type="password" autocomplete="current-password" required />
          <button id="login-button" class="button" type="submit">ログイン</button>
          <p id="login-error" class="error" role="alert"></p>
        </form>
      </section>

      <section id="main-screen" class="hidden">
        <div class="card">
          <p class="muted">アップロードとフォルダ・チーム管理は準備中です。</p>
        </div>
        <button id="logout-button" class="button-sub" type="button">ログアウト</button>
      </section>
    </main>
  </body>
</html>
