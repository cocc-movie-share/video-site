# Cloudflare Worker の設定
# 秘密情報（パスワード・署名鍵）はここに書かず、`npx wrangler secret put 名前` で登録する

name = "cocc-video-site-api"
main = "src/index.ts"
compatibility_date = "2026-10-01"
# 公開 URL（workers.dev）は使い、テスト用のプレビュー URL は作らない
workers_dev = true
preview_urls = false

[vars]
# GitHub Pages のドメイン（この画面からの呼び出しだけを許可する）
ALLOWED_ORIGIN = "https://cocc-movie-share.github.io"
# アップロードできる動画の上限サイズ（MB）
MAX_UPLOAD_MB = "2048"

# このプロジェクト専用のバケットだけを使う
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "cocc-video-site"

# ログイン試行の回数制限（1 分あたり 5 回）
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"
simple = { limit = 5, period = 60 }

[observability]
enabled = true
